name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "js-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 零依賴，不需要安裝任何東西
      - run: node --test
        working-directory: js

  build-python:
    needs: [python, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      # 裝起來實際 import 一次，確認打包沒漏東西
      - name: 驗證輪檔
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "import emltree; print('emltree ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write     # Trusted Publishing 用 OIDC，不需要在 repo 存 token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/js-v')
    needs: js
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Node 22 內建的是 npm 10.x，不支援 OIDC trusted publishing（需要 11.5.1 以上），
      # 沒升的話 npm 會退回 token 認證，用 setup-node 填的佔位字串去發，registry 回 E404。
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
        working-directory: js
